# No Java: a helicopter for Rotorcraft is two datapack entries, a mesh and a sound.
modLoader="lowcodefml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/the-rusty-shackleford/minecraft-huey/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rusty Shackleford, nfx"
description='''
The Huey: a life-size Bell UH-1H for Rotorcraft. A pilot, a copilot and six
aboard in an open cabin; skids; a hook under the belly for a sling load; a
mount for the crop sprayer. Built on the Mechanic Lift, dyeable, and flown
with Space and Shift like every rotorcraft.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The rotorcraft protocol, nested in this jar, with Vanilla Wheels nested in it.
[[dependencies.${mod_id}]]
    modId="rotorcraft"
    type="required"
    versionRange="[1.2.0,2.0)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="vanillawheels"
    type="required"
    versionRange="[1.14.0,2.0)"
    ordering="AFTER"
    side="BOTH"
